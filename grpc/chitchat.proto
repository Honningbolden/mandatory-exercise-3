syntax = "proto3";
package chitchat;

option go_package = "chitchat/grpc";

message Nothing {}

message User {
    string username = 1;
    int64 timestamp = 2;
}

// Message for all server messages
message Message {
    string sender = 1;
    string content = 2;
    int64 timestamp = 3;
}

service ChitChatService {
    rpc PostMessage(Message) returns (Nothing);
    rpc Connect(User) returns (stream Message); // a stream is kinda like a channel but for outside programs
    rpc Disconnect(User) returns (Nothing);
}